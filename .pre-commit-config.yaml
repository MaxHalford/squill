repos:
  - repo: local
    hooks:
      - id: typecheck
        name: type check
        entry: npm run type-check
        language: system
        files: ^(src/|vite\.config\.ts$)
        types_or: [ts, vue]
        pass_filenames: false
      - id: lint
        name: lint
        entry: npm run lint
        language: system
        files: ^(src/|vite\.config\.ts$)
        types_or: [ts, vue]
        pass_filenames: false
      - id: test
        name: tests
        entry: npm run test:run
        language: system
        files: ^(src/|vite\.config\.ts$)
        types_or: [ts, vue]
        pass_filenames: false
